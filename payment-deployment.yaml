apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  labels:
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: payment
          image: 531728396484.dkr.ecr.ap-south-1.amazonaws.com/lms-payment:1
          ports:
            - containerPort: 3000