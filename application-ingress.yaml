apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: skillfynder-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: localhost
      http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          - path: /login
            pathType: Prefix
            backend:
              service:
                name: login-service
                port:
                  number: 80

          - path: /payment
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 80

#kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.2/deploy/static/provider/kind/deploy.yaml